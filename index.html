<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e3b43">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Personal Ticket Holder</title>
<style>
:root{--ink:#0e3b43;--acc:#f2a541;--mut:#5d7479;--line:#d9e3e2;--tint:#e8f1ef;--ok:#1f9d5b;--warn:#d98a1c;--off:#9aa9ac}
*{box-sizing:border-box;margin:0}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#fff;-webkit-text-size-adjust:100%}
#app{min-height:100dvh;display:flex;flex-direction:column}
.top{padding-top:calc(env(safe-area-inset-top) + 18px)}
.pad{padding-left:22px;padding-right:22px}
.grow{flex:1}
.c{text-align:center}
.col{display:flex;flex-direction:column;gap:12px}
h1{font-size:28px;line-height:1.15;letter-spacing:-.01em}
h2{font-size:22px;margin:6px 0 14px}
.mut{color:var(--mut)}
.fine{font-size:12px;color:var(--mut);text-align:center;margin:10px 0}
.sp{flex:1;min-height:24px}
.logo{width:76px;height:76px;margin:12vh auto 18px;border-radius:22px;background:var(--ink);color:var(--acc);display:grid;place-items:center;font-weight:800;font-size:26px;letter-spacing:.04em}
.btn{display:block;width:100%;padding:16px;border:2px solid var(--ink);border-radius:14px;font:700 16px system-ui,sans-serif;background:var(--ink);color:#fff;text-align:center;cursor:pointer}
.btn.acc{background:var(--acc);border-color:var(--acc);color:var(--ink)}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.big{padding:22px;font-size:19px}
.lnk{background:none;border:0;color:var(--ink);font:600 15px system-ui;text-decoration:underline;padding:8px;cursor:pointer}
.lnk.bad{color:#b3261e;font-weight:500;font-size:13px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--mut)}
input[type=text],input[type=tel],input[type=email],input[type=datetime-local]{width:100%;margin-top:4px;padding:13px;border:1.5px solid var(--line);border-radius:10px;font:16px system-ui;color:var(--ink);background:#fff}
input:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.lock{font:12px ui-monospace,Menlo,monospace;background:var(--tint);border-radius:10px;padding:10px;word-break:break-all;max-height:84px;overflow:auto}
nav{display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);background:#fff;position:sticky;bottom:0}
nav button{flex:1;padding:14px;background:none;border:0;font:600 15px system-ui;color:var(--mut);border-top:3px solid transparent;margin-top:-1px}
nav button.on{color:var(--ink);border-top-color:var(--acc)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.row b{display:block;font-size:18px}
.row button.open{flex:1;text-align:left;background:none;border:0;font:inherit;color:inherit;cursor:pointer}
.pp{width:110px;height:110px;border-radius:50%;object-fit:cover;background:var(--tint);display:block;margin:0 auto 12px}
.scan{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:1}
.scan video{width:100%;height:100%;object-fit:cover}
.scan:after{content:"";position:absolute;inset:18%;border:3px solid var(--acc);border-radius:14px}
.prev{width:100%;max-height:40vh;object-fit:contain;border-radius:12px;background:var(--tint)}
/* ticket */
.tk{flex:1;display:flex;flex-direction:column;min-height:100dvh;text-align:center}
.th{background:var(--ink);color:#fff;position:relative;padding-bottom:16px}
.th small{display:block;font-size:11px;letter-spacing:.14em;color:var(--acc)}
.th h1{font-size:clamp(34px,10.5vw,46px);margin-top:4px;padding:0 44px;overflow-wrap:anywhere}
.back{position:absolute;left:8px;bottom:14px;background:none;border:0;color:#fff;font-size:34px;line-height:1;padding:6px 14px;cursor:pointer}
.mid{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;padding:10px 20px}
.qrw{width:min(64vw,36dvh);aspect-ratio:1;background:#fff}
.qrw canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.st{display:flex;align-items:center;gap:14px;font-size:clamp(32px,10vw,44px);font-weight:700}
.st i{width:.42em;height:.42em;border-radius:50%;background:var(--c)}
.active{--c:var(--ok)}.upcoming{--c:var(--warn)}.expired{--c:var(--off)}.saved{--c:var(--acc)}
.active i{animation:pl 1.6s ease-in-out infinite}
@keyframes pl{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.active i{animation:none}}
.clock{font-size:clamp(30px,9vw,40px);font-weight:700;font-variant-numeric:tabular-nums}
.ph{width:min(28vw,15dvh);aspect-ratio:1;border-radius:50%;overflow:hidden;background:var(--tint);display:grid;place-items:center}
.ph img{width:100%;height:100%;object-fit:cover}
.cdw{width:100%;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0}
.cdl{font-size:12px;color:var(--mut);min-height:16px}
.cd{display:flex;justify-content:center;gap:6px;font-size:clamp(26px,8vw,34px);font-weight:700;font-variant-numeric:tabular-nums}
.cd small{display:block;font-size:11px;font-weight:500;color:var(--mut)}
.meta{font-size:13px;color:var(--mut)}
.disc{font-size:11px;color:var(--mut);padding:8px 20px calc(env(safe-area-inset-bottom) + 10px)}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
"use strict";
const KEY="busAppData",LBL={active:"Active",upcoming:"Upcoming",expired:"Expired",saved:"Saved"};
let D,view="home",draft=null,imgUrl="",pendPhoto="",shown="",stream=null,scanOn=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");

/* ---------- storage ---------- */
function loadData(){
  try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){D=null}
  D=D||{};
  D.profile=Object.assign({firstName:"",lastName:"",passengerId:"",phone:"",email:"",photo:""},D.profile);
  D.tickets=D.tickets||[];D.selectedTicketId=D.selectedTicketId||"";D.settings=D.settings||{};
}
function saveData(){
  try{localStorage.setItem(KEY,JSON.stringify(D));return true}
  catch(e){alert("Could not save: this browser's storage is full or blocked.");return false}
}
const cur=()=>D.tickets.find(t=>t.id===D.selectedTicketId)||D.tickets[0]||null;

/* ---------- status & countdown (calculated, never typed in) ---------- */
function statusOf(t){
  const n=Date.now(),d=t.departureAt?+new Date(t.departureAt):0,e=t.validUntil?+new Date(t.validUntil):0;
  if(e&&n>e)return"expired";
  if(d&&n<d)return"upcoming";
  return(d||e)?"active":"saved";
}
function targetOf(t){
  const n=Date.now(),d=t.departureAt?+new Date(t.departureAt):0,e=t.validUntil?+new Date(t.validUntil):0;
  if(d&&n<d)return[d,"until departure"];
  if(e&&n<e)return[e,"until expiry"];
  return[0,""];
}

/* ---------- navigation ---------- */
function go(v){stopCamera();view=v;render();window.scrollTo(0,0)}
function viewTicket(){D.tickets.length?go("ticket"):go("none")}
function nav(){
  const p=view==="profile";
  return`<nav><button class="${p?"":"on"}" onclick="viewTicket()">Ticket</button><button class="${p?"on":""}" onclick="go('profile')">Profile</button></nav>`;
}

/* ---------- screens ---------- */
function renderWelcome(){
  return`<main class="pad top grow c col"><div class="logo" aria-hidden="true">PTH</div>
  <h1>Personal Ticket Holder</h1>
  <p class="mut">Keep the tickets you've already bought, ready to show.</p><div class="sp"></div>
  <button class="btn acc big" onclick="viewTicket()">VIEW TICKET</button>
  <button class="btn ghost" onclick="go('add')">Add ticket</button>
  ${D.tickets.length>1?`<button class="lnk" onclick="go('list')">My tickets (${D.tickets.length})</button>`:""}
  <p class="fine">Unofficial app. Not affiliated with or endorsed by any bus operator.</p></main>`+nav();
}
function renderNone(){
  return`<main class="pad top grow c col"><div class="sp"></div><h1>No ticket added yet</h1>
  <p class="mut">Scan or upload the QR code from a ticket you've bought.</p>
  <button class="btn acc big" onclick="go('add')">ADD TICKET</button><div class="sp"></div></main>`+nav();
}
function renderTicketList(){
  const rows=D.tickets.map(t=>`<div class="row"><button class="open" onclick="selectTicket('${t.id}')"><b>${esc(t.destination)}</b><span class="mut">${esc(fmtDate(t.departureAt)||"No date")} · ${LBL[statusOf(t)]}</span></button><button class="lnk bad" onclick="deleteTicket('${t.id}')">Delete</button></div>`).join("");
  return`<main class="pad top grow"><h2>My tickets</h2>${rows||'<p class="mut">No tickets yet.</p>'}
  <div class="col" style="margin-top:18px"><button class="btn acc" onclick="go('add')">Add ticket</button></div></main>`+nav();
}
function renderAdd(){
  const inp=(c)=>`<input type="file" accept="image/*" ${c?'capture="environment"':""} style="display:none" onchange="onImg(this)">`;
  return`<main class="pad top grow col"><h2>Add ticket</h2>
  <p class="mut">The QR code is stored exactly as read. It can't be edited afterwards.</p>
  <button class="btn acc" onclick="openQRScanner()">Scan QR code</button>
  <label class="btn ghost">Take or upload ticket photo${inp(true)}</label>
  <label class="btn ghost">Upload QR image${inp(false)}</label>
  <button class="lnk" onclick="go('home')">Cancel</button></main>`+nav();
}
function renderScan(){
  return`<main class="pad top grow col"><h2>Scan QR code</h2>
  <div class="scan"><video id="v" playsinline muted autoplay></video></div>
  <p id="smsg" class="mut c">Point the camera at the QR code.</p>
  <label class="btn ghost">Upload QR image instead<input type="file" accept="image/*" style="display:none" onchange="onImg(this)"></label>
  <button class="lnk" onclick="go('add')">Back</button></main>`;
}
function renderNoFound(){
  return`<main class="pad top grow col"><h2>No QR code found</h2>
  ${imgUrl?`<img class="prev" src="${imgUrl}" alt="Uploaded image">`:""}
  <p class="mut">Try a sharper, closer photo with the whole QR code in frame and no glare.</p>
  <label class="btn acc">Choose another photo<input type="file" accept="image/*" style="display:none" onchange="onImg(this)"></label>
  <button class="btn ghost" onclick="openQRScanner()">Scan with camera</button>
  <button class="lnk" onclick="go('add')">Back</button></main>`;
}
function renderDetails(){
  const p=D.profile,nm=((p.firstName||"")+" "+(p.lastName||"")).trim();
  return`<main class="pad top grow"><h2>Ticket details</h2>
  <form class="col" onsubmit="saveTicket(event)">
  <div><label class="f">QR data (locked, exactly as scanned)</label><div class="lock">${esc(draft.qrData)}</div></div>
  <label class="f">Destination<input type="text" name="destination" required maxlength="40"></label>
  <label class="f">Service name<input type="text" name="busName" maxlength="40"></label>
  <label class="f">Ticket number<input type="text" name="ticketNumber" maxlength="40"></label>
  <label class="f">Passenger name<input type="text" name="passengerName" maxlength="60" value="${esc(nm)}"></label>
  <label class="f">Seat<input type="text" name="seatNumber" maxlength="10"></label>
  <label class="f">Departure<input type="datetime-local" name="departureAt"></label>
  <label class="f">Valid until<input type="datetime-local" name="validUntil"></label>
  <p class="fine" style="text-align:left">Details are locked once saved. To change them, delete the ticket and import it again. Status and countdown are calculated from these dates. They don't verify the ticket.</p>
  <button class="btn acc" type="submit">Save ticket</button>
  <button class="btn ghost" type="button" onclick="go('add')">Cancel</button></form></main>`;
}
function renderProfile(){
  const p=D.profile;pendPhoto=p.photo;
  return`<main class="pad top grow"><h2>Profile</h2>
  <form class="col" onsubmit="saveProfile(event)">
  <div class="c"><img id="pp" class="pp" alt="" src="${pendPhoto||blank()}">
  <label class="lnk">Choose photo<input type="file" accept="image/*" style="display:none" onchange="onPhoto(this)"></label></div>
  <label class="f">First name<input type="text" name="firstName" value="${esc(p.firstName)}"></label>
  <label class="f">Last name<input type="text" name="lastName" value="${esc(p.lastName)}"></label>
  <label class="f">Passenger ID<input type="text" name="passengerId" value="${esc(p.passengerId)}"></label>
  <label class="f">Phone<input type="tel" name="phone" value="${esc(p.phone)}"></label>
  <label class="f">Email<input type="email" name="email" value="${esc(p.email)}"></label>
  <button class="btn acc" type="submit">SAVE PROFILE</button>
  <button class="btn ghost" type="button" onclick="removePhoto()">REMOVE PHOTO</button></form>
  <div class="c" style="margin:26px 0 8px"><button class="lnk bad" onclick="resetApplication()">Reset all data</button></div></main>`+nav();
}
function renderTicket(){
  const t=cur();if(!t){view="none";return renderNone()}
  const s=statusOf(t);shown=s;
  const ph=D.profile.photo?`<img src="${D.profile.photo}" alt="Passenger photo">`:`<svg viewBox="0 0 100 100" width="62%" aria-label="No photo"><circle cx="50" cy="38" r="17" fill="#9db3b6"/><path d="M16 92c2-24 17-34 34-34s32 10 34 34z" fill="#9db3b6"/></svg>`;
  const meta=[t.busName,t.ticketNumber&&"#"+t.ticketNumber,t.seatNumber&&"Seat "+t.seatNumber,t.passengerName].filter(Boolean).map(esc).join(" · ");
  return`<div class="tk"><header class="th top"><button class="back" onclick="go('home')" aria-label="Back">&#8249;</button><small>PERSONAL TICKET HOLDER</small><h1>${esc(t.destination)}</h1></header>
  <div class="mid"><div class="qrw"><canvas id="qr" role="img" aria-label="Ticket QR code"></canvas></div>
  <div class="st ${s}"><i></i><span>${LBL[s]}</span><i></i></div>
  <div class="clock" id="clock">--:--:--</div>
  <div class="ph">${ph}</div>
  <div class="cdw"><div class="cdl" id="cdl"></div><div class="cd">${["days","hrs","mins","seconds"].map((l,i)=>`<div><span id="cd${i}">00</span><small>${l}</small></div>${i<3?"<span>:</span>":""}`).join("")}</div></div>
  <div class="meta">${meta}</div></div>
  <p class="disc">Personal Ticket Holder is not the bus operator. It only displays the QR code you imported.</p></div>`;
}

/* ---------- render ---------- */
function render(){
  const m={home:renderWelcome,none:renderNone,list:renderTicketList,add:renderAdd,scan:renderScan,nofound:renderNoFound,details:renderDetails,profile:renderProfile,ticket:renderTicket};
  $("#app").innerHTML=(m[view]||renderWelcome)();
  if(view==="ticket"){const t=cur();if(t){generateQRCode(t.qrData,$("#qr"));tick()}}
  if(view==="scan")startScan();
}
function fmtDate(v){if(!v)return"";const d=new Date(v);return isNaN(d)?"":d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})}
function blank(){return"data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#e8f1ef"/><circle cx="50" cy="38" r="17" fill="#9db3b6"/><path d="M16 92c2-24 17-34 34-34s32 10 34 34z" fill="#9db3b6"/></svg>')}

/* ---------- QR display ---------- */
function generateQRCode(text,cv){
  const fail=m=>cv.parentNode.replaceChildren(Object.assign(document.createElement("p"),{textContent:m,className:"mut"}));
  if(!window.qrcode)return fail("QR library didn't load. Connect to the internet once, then reload.");
  try{
    if(qrcode.stringToBytesFuncs&&qrcode.stringToBytesFuncs["UTF-8"])qrcode.stringToBytes=qrcode.stringToBytesFuncs["UTF-8"];
    const q=qrcode(0,"M");q.addData(text,"Byte");q.make();
    const n=q.getModuleCount(),z=4,s=Math.max(4,Math.floor(1100/(n+2*z))),size=(n+2*z)*s;
    cv.width=cv.height=size;const x=cv.getContext("2d");
    x.fillStyle="#fff";x.fillRect(0,0,size,size);x.fillStyle="#000";
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))x.fillRect((c+z)*s,(r+z)*s,s,s);
  }catch(e){fail("This QR code is too large to display.")}
}

/* ---------- clock & countdown ---------- */
function tick(){
  const c=$("#clock");if(!c)return;const t=cur();if(!t)return;
  const n=new Date();c.textContent=pad(n.getHours())+":"+pad(n.getMinutes())+":"+pad(n.getSeconds());
  if(statusOf(t)!==shown){render();return}
  const[tg,l]=targetOf(t),r=tg?Math.max(0,Math.floor((tg-Date.now())/1000)):0;
  const v=[Math.floor(r/86400),Math.floor(r%86400/3600),Math.floor(r%3600/60),r%60];
  v.forEach((x,i)=>{const e=$("#cd"+i);if(e)e.textContent=pad(x)});
  $("#cdl").textContent=l;
}
function startClock(){setInterval(tick,1000);document.addEventListener("visibilitychange",tick)}
const startCountdown=startClock;

/* ---------- QR import ---------- */
async function decodeCanvas(cv){
  if("BarcodeDetector"in window){
    try{const r=await new BarcodeDetector({formats:["qr_code"]}).detect(cv);if(r[0]&&r[0].rawValue)return r[0].rawValue}catch(e){}
  }
  if(window.jsQR){
    const id=cv.getContext("2d",{willReadFrequently:true}).getImageData(0,0,cv.width,cv.height);
    const q=jsQR(id.data,cv.width,cv.height,{inversionAttempts:"attemptBoth"});if(q)return q.data;
  }
  return null;
}
async function onImg(inp){
  const f=inp.files&&inp.files[0];inp.value="";if(!f)return;
  stopCamera();
  if(imgUrl)URL.revokeObjectURL(imgUrl);imgUrl=URL.createObjectURL(f);
  const im=new Image();
  im.onload=async()=>{
    let found=null;
    for(const max of[1600,900,2400]){
      const k=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement("canvas");
      cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);
      cv.getContext("2d",{willReadFrequently:true}).drawImage(im,0,0,cv.width,cv.height);
      found=await decodeCanvas(cv);if(found)break;
    }
    found?handleQRResult(found):go("nofound");
  };
  im.onerror=()=>go("nofound");
  im.src=imgUrl;
}
function openQRScanner(){go("scan")}
async function startScan(){
  const msg=$("#smsg"),v=$("#v");
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg.textContent="Camera isn't available here. Upload a photo of the QR code instead.";return}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
    if(view!=="scan"){stopCamera();return}
    v.srcObject=stream;await v.play();scanOn=true;
    const cv=document.createElement("canvas");
    const loop=async()=>{
      if(!scanOn)return;
      if(v.videoWidth){
        const k=Math.min(1,900/v.videoWidth);cv.width=v.videoWidth*k;cv.height=v.videoHeight*k;
        cv.getContext("2d",{willReadFrequently:true}).drawImage(v,0,0,cv.width,cv.height);
        const r=await decodeCanvas(cv);if(r&&scanOn){handleQRResult(r);return}
      }
      setTimeout(loop,200);
    };
    loop();
  }catch(e){msg.textContent="Couldn't open the camera. Allow camera access, or upload a photo of the QR code instead."}
}
function stopCamera(){scanOn=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function handleQRResult(text){
  stopCamera();
  if(D.tickets.some(t=>t.qrData===text)){alert("This QR code is already saved.");go("list");return}
  draft={qrData:text};go("details");
}

/* ---------- tickets ---------- */
function saveTicket(e){
  e.preventDefault();const f=new FormData(e.target),g=k=>(f.get(k)||"").trim();
  const t={id:"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),qrData:draft.qrData,destination:g("destination"),busName:g("busName"),ticketNumber:g("ticketNumber"),passengerName:g("passengerName"),seatNumber:g("seatNumber"),departureAt:g("departureAt"),validUntil:g("validUntil"),addedAt:new Date().toISOString()};
  D.tickets.push(t);D.selectedTicketId=t.id;
  if(!saveData()){D.tickets.pop();return}
  draft=null;go("ticket");
}
function selectTicket(id){D.selectedTicketId=id;saveData();go("ticket")}
function deleteTicket(id){
  if(!confirm("Delete this ticket from this device?"))return;
  D.tickets=D.tickets.filter(t=>t.id!==id);
  if(D.selectedTicketId===id)D.selectedTicketId=D.tickets[0]?D.tickets[0].id:"";
  saveData();render();
}

/* ---------- profile ---------- */
function onPhoto(inp){
  const f=inp.files&&inp.files[0];inp.value="";if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const k=Math.min(1,400/Math.max(im.width,im.height)),cv=document.createElement("canvas");
    cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);
    cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
    pendPhoto=cv.toDataURL("image/jpeg",.85);$("#pp").src=pendPhoto;
  };im.src=r.result};
  r.readAsDataURL(f);
}
function saveProfile(e){
  e.preventDefault();const f=new FormData(e.target),p=D.profile,old=Object.assign({},p);
  ["firstName","lastName","passengerId","phone","email"].forEach(k=>p[k]=(f.get(k)||"").trim());
  p.photo=pendPhoto;
  if(!saveData()){D.profile=old;return}
  go("ticket"===view?"ticket":"home");
}
function removePhoto(){pendPhoto="";D.profile.photo="";saveData();$("#pp").src=blank()}

/* ---------- reset ---------- */
function resetApplication(){
  if(!confirm("Delete all locally saved tickets and profile data?"))return;
  localStorage.clear();loadData();go("home");
}

loadData();render();startClock();
</script>
</body>
</html>
